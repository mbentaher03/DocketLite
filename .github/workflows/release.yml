name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg APP_VERSION="${GITHUB_REF_NAME}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to staging and check health
        env:  IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker compose -f compose.staging.yaml pull
          docker compose -f compose.staging.yaml up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo; curl -fsS http://localhost:8080/version; echo; exit 0
            fi
            sleep 2
          done
          docker compose -f compose.staging.yaml logs --tail=50 api
          exit 1
