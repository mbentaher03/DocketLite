name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest (JUnit report)
        run: pytest --junitxml=junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: junit.xml
          if-no-files-found: ignore
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and verify /health
        run: |
          docker build -t docketlite:ci .
          docker run -d --name docketlite-ci -p 8080:8080 docketlite:ci
          trap 'docker rm -f docketlite-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "health OK"; exit 0
            fi
            sleep 1
          done
          docker logs docketlite-ci
          exit 1
