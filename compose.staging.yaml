name: docketlite-staging
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docketlite
      POSTGRES_USER: docketlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docketlite_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [staging_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docketlite -d docketlite"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  api:
    image: ghcr.io/mbentaher03/docketlite:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://docketlite:${POSTGRES_PASSWORD:-docketlite_pass}@db:5432/docketlite
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [staging_net]
    restart: unless-stopped
networks:
  staging_net:
volumes:
  pgdata:
